spring:
  application:
    name: pxgo-backend
  datasource:
    # Stable across working directories; Spring closes the pool and its physical connections.
    url: jdbc:h2:file:${user.home}/.pxgo/data/pxgo;DB_CLOSE_ON_EXIT=FALSE
    username: sa
    password: ""
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
    clean-disabled: true

server:
  address: 127.0.0.1
  port: 8081
  error:
    include-message: never
    include-stacktrace: never
    include-binding-errors: never
    include-exception: false

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
      show-components: never
